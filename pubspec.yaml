name: tmdb_flutter
description: Flutter client for TMDB.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cached_network_image: ^4.0.5
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.7
  skeletonizer: ^3.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.16.2
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.2
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
